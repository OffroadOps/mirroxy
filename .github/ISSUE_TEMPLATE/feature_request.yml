name: 功能建议 / Feature request
description: 提出一个新功能或改进。/ Suggest a feature or an improvement.
body:
  - type: markdown
    attributes:
      value: |
        较大的改动请先开 Issue 讨论方案，再提交 PR。
        For larger changes please open an issue to discuss the design before sending a PR.
  - type: textarea
    id: problem
    attributes:
      label: 想解决什么问题 / What problem does this solve
      description: 描述现状与期望，而不是直接写实现方案。/ Describe the situation and the goal, not the implementation.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 期望的交互或行为 / Expected behaviour
  - type: dropdown
    id: platform
    attributes:
      label: 涉及平台 / Platforms
      options:
        - Windows x86_64
        - Linux ARM64
        - Linux AMD64
        - macOS ARM64
        - 仅服务端 / Server only
        - 全部 / All
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的其它方案 / Alternatives considered
