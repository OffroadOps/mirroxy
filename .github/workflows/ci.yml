name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          check-latest: true
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...
      - name: Frontend syntax
        run: |
          for file in web/*.js; do node --check "$file"; done

  cross-compile:
    name: Cross compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          check-latest: true
      - name: Windows AMD64
        run: GOOS=windows GOARCH=amd64 go build -trimpath -ldflags '-s -w -H=windowsgui' -o /dev/null .
      - name: Windows AMD64 updater
        run: GOOS=windows GOARCH=amd64 go build -trimpath -ldflags '-s -w' -o /dev/null ./cmd/upgrade
      - name: Linux AMD64
        run: GOOS=linux GOARCH=amd64 go build -trimpath -ldflags '-s -w' -o /dev/null .
      - name: Linux ARM64
        run: GOOS=linux GOARCH=arm64 go build -trimpath -ldflags '-s -w' -o /dev/null .
      - name: macOS ARM64
        run: GOOS=darwin GOARCH=arm64 go build -trimpath -ldflags '-s -w' -o /dev/null .
